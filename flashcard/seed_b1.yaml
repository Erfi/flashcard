# B1-Auffrischungsdeck — Wortschatz und Grammatik für den Wiedereinstieg.
# Import: python -m flashcard seed
cards:
  # ------------------------------------------------------------ Nomen: die
  - {type: noun, article: die, lemma: Erfahrung, plural: die Erfahrungen, level: B1, source: seed,
     definition: "Wissen, das man bekommt, weil man etwas selbst erlebt hat.",
     example: "Im Praktikum habe ich viel Erfahrung gesammelt.", tags: [arbeit]}
  - {type: noun, article: die, lemma: Entscheidung, plural: die Entscheidungen, level: B1, source: seed,
     definition: "Das Ergebnis, wenn man sich zwischen mehreren Möglichkeiten festlegt.",
     example: "Diese Entscheidung war für mich nicht leicht.", tags: [alltag]}
  - {type: noun, article: die, lemma: Möglichkeit, plural: die Möglichkeiten, level: B1, source: seed,
     definition: "Eine Sache, die man tun kann; eine Gelegenheit.",
     example: "Du hast die Möglichkeit, den Termin zu verschieben.", tags: [alltag]}
  - {type: noun, article: die, lemma: Bewerbung, plural: die Bewerbungen, level: B1, source: seed,
     definition: "Die Unterlagen, mit denen man um eine Stelle bittet.",
     example: "Meine Bewerbung habe ich gestern abgeschickt.", tags: [arbeit]}
  - {type: noun, article: die, lemma: Rechnung, plural: die Rechnungen, level: B1, source: seed,
     definition: "Ein Papier, auf dem steht, wie viel man bezahlen muss.",
     example: "Die Rechnung müssen Sie innerhalb von zwei Wochen überweisen.", tags: [geld]}
  - {type: noun, article: die, lemma: Versicherung, plural: die Versicherungen, level: B1, source: seed,
     definition: "Eine Firma, die bei einem Schaden das Geld bezahlt.",
     example: "Die Versicherung hat den Schaden am Auto bezahlt.", tags: [amt, geld]}
  - {type: noun, article: die, lemma: Wohnung, plural: die Wohnungen, level: A2, source: seed,
     definition: "Mehrere Räume in einem Haus, in denen jemand wohnt.",
     example: "Unsere Wohnung liegt im dritten Stock ohne Aufzug.", tags: [wohnen]}
  - {type: noun, article: die, lemma: Umgebung, plural: die Umgebungen, level: B1, source: seed,
     definition: "Das Gebiet, das um einen Ort herum liegt.",
     example: "In der Umgebung der Stadt gibt es schöne Wanderwege.", tags: [wohnen]}
  - {type: noun, article: die, lemma: Aufgabe, plural: die Aufgaben, level: A2, source: seed,
     definition: "Etwas, das jemand machen oder lösen soll.",
     example: "Diese Aufgabe erledige ich noch heute.", tags: [arbeit]}
  - {type: noun, article: die, lemma: Meinung, plural: die Meinungen, level: B1, source: seed,
     definition: "Das, was jemand über eine Sache denkt.",
     example: "Meiner Meinung nach ist der Vorschlag zu teuer.", tags: [diskussion]}
  - {type: noun, article: die, lemma: Umwelt, plural: "", level: B1, source: seed,
     definition: "Die Natur mit Luft, Wasser und Boden, in der wir leben.",
     example: "Mit dem Fahrrad schützt du die Umwelt.", tags: [umwelt]}
  - {type: noun, article: die, lemma: Gesundheit, plural: "", level: B1, source: seed,
     definition: "Der Zustand, wenn der Körper gut funktioniert.",
     example: "Für meine Gesundheit gehe ich jeden Tag spazieren.", tags: [koerper]}
  - {type: noun, article: die, lemma: Behörde, plural: die Behörden, level: B1, source: seed,
     definition: "Eine Stelle vom Staat, die Anträge und Papiere bearbeitet.",
     example: "Bei der Behörde muss ich einen Antrag stellen.", tags: [amt]}
  - {type: noun, article: die, lemma: Ausbildung, plural: die Ausbildungen, level: B1, source: seed,
     definition: "Die Zeit, in der man einen Beruf systematisch lernt.",
     example: "Nach der Ausbildung hat sie sofort eine Stelle gefunden.", tags: [arbeit]}
  - {type: noun, article: die, lemma: Verspätung, plural: die Verspätungen, level: B1, source: seed,
     definition: "Die Zeit, die jemand oder etwas zu spät kommt.",
     example: "Der Zug hatte zwanzig Minuten Verspätung.", tags: [reisen]}
  - {type: noun, article: die, lemma: Unterstützung, plural: die Unterstützungen, level: B1, source: seed,
     definition: "Hilfe, die man von anderen bekommt.",
     example: "Ohne die Unterstützung meiner Familie hätte ich das nicht geschafft.", tags: [alltag]}
  # ------------------------------------------------------------ Nomen: der
  - {type: noun, article: der, lemma: Zusammenhang, plural: die Zusammenhänge, level: B1, source: seed,
     definition: "Die Verbindung zwischen zwei Dingen oder Ereignissen.",
     example: "Zwischen Stress und Schlafproblemen gibt es einen Zusammenhang.", tags: [diskussion]}
  - {type: noun, article: der, lemma: Vorschlag, plural: die Vorschläge, level: B1, source: seed,
     definition: "Eine Idee, die man anderen zur Entscheidung anbietet.",
     example: "Dein Vorschlag gefällt mir besser als meiner.", tags: [diskussion]}
  - {type: noun, article: der, lemma: Termin, plural: die Termine, level: A2, source: seed,
     definition: "Ein fester Zeitpunkt für eine Verabredung.",
     example: "Ich habe morgen einen Termin bei der Behörde.", tags: [alltag, amt]}
  - {type: noun, article: der, lemma: Vertrag, plural: die Verträge, level: B1, source: seed,
     definition: "Eine schriftliche Vereinbarung, die beide Seiten unterschreiben.",
     example: "Vor der Unterschrift solltest du den Vertrag genau lesen.", tags: [amt, arbeit]}
  - {type: noun, article: der, lemma: Ausdruck, plural: die Ausdrücke, level: B1, source: seed,
     definition: "Ein Wort oder eine Wendung, die man benutzt.",
     example: "Diesen Ausdruck habe ich noch nie gehört.", tags: [sprache]}
  - {type: noun, article: der, lemma: Vorteil, plural: die Vorteile, level: B1, source: seed,
     definition: "Eine gute Seite einer Sache.",
     example: "Der große Vorteil dieser Wohnung ist die ruhige Umgebung.", tags: [diskussion]}
  - {type: noun, article: der, lemma: Nachteil, plural: die Nachteile, level: B1, source: seed,
     definition: "Eine schlechte Seite einer Sache.",
     example: "Der Nachteil ist, dass die Miete sehr hoch ist.", tags: [diskussion]}
  - {type: noun, article: der, lemma: Antrag, plural: die Anträge, level: B1, source: seed,
     definition: "Eine schriftliche Bitte an eine Behörde.",
     example: "Den Antrag auf Kindergeld habe ich online gestellt.", tags: [amt]}
  - {type: noun, article: der, lemma: Eindruck, plural: die Eindrücke, level: B1, source: seed,
     definition: "Das Bild oder Gefühl, das jemand oder etwas bei uns hinterlässt.",
     example: "Der neue Kollege hat einen guten Eindruck gemacht.", tags: [diskussion]}
  - {type: noun, article: der, lemma: Zettel, plural: die Zettel, level: A2, source: seed,
     definition: "Ein kleines Stück Papier für kurze Notizen.",
     example: "Auf dem Zettel steht der Termin beim Arzt.", tags: [alltag]}
  # ------------------------------------------------------------ Nomen: das
  - {type: noun, article: das, lemma: Verhältnis, plural: die Verhältnisse, level: B1, source: seed,
     definition: "Die Beziehung zwischen Personen oder Dingen.",
     example: "Zu meinen Nachbarn habe ich ein gutes Verhältnis.", tags: [menschen]}
  - {type: noun, article: das, lemma: Gespräch, plural: die Gespräche, level: A2, source: seed,
     definition: "Wenn zwei oder mehr Menschen miteinander sprechen.",
     example: "Das Gespräch mit dem Chef war überraschend angenehm.", tags: [arbeit]}
  - {type: noun, article: das, lemma: Ergebnis, plural: die Ergebnisse, level: B1, source: seed,
     definition: "Das, was am Ende einer Arbeit oder Prüfung herauskommt.",
     example: "Das Ergebnis der Prüfung kommt in zwei Wochen.", tags: [schule]}
  - {type: noun, article: das, lemma: Angebot, plural: die Angebote, level: B1, source: seed,
     definition: "Etwas, das jemand anbietet, oft zu einem guten Preis.",
     example: "Dieses Angebot gilt nur bis Ende der Woche.", tags: [geld]}
  - {type: noun, article: das, lemma: Verständnis, plural: "", level: B1, source: seed,
     definition: "Wenn man die Lage eines anderen nachfühlen und akzeptieren kann.",
     example: "Ich habe Verständnis für deine Entscheidung.", tags: [menschen]}
  - {type: noun, article: das, lemma: Ziel, plural: die Ziele, level: A2, source: seed,
     definition: "Das, was jemand erreichen will.",
     example: "Mein Ziel ist es, die B1-Prüfung zu bestehen.", tags: [alltag]}
  # ------------------------------------------------------------------ Verben
  - {type: verb, lemma: erledigen, praesens_3sg: erledigt, praeteritum: erledigte, perfekt: hat erledigt,
     aux: haben, separable: false, level: B1, source: seed,
     definition: "Eine Aufgabe fertig machen.",
     example: "Diese Aufgabe erledige ich noch vor dem Termin.", tags: [arbeit]}
  - {type: verb, lemma: beantragen, praesens_3sg: beantragt, praeteritum: beantragte, perfekt: hat beantragt,
     aux: haben, separable: false, level: B1, source: seed,
     definition: "Bei einer Behörde schriftlich um etwas bitten.",
     example: "Wir haben bei der Behörde eine neue Karte beantragt.", tags: [amt]}
  - {type: verb, lemma: sich bewerben, praesens_3sg: bewirbt sich, praeteritum: bewarb sich,
     perfekt: hat sich beworben, aux: haben, separable: false, rection: "sich bewerben um + Akk. / bei + Dat.",
     level: B1, source: seed,
     definition: "Um eine Stelle bitten und dafür Unterlagen schicken.",
     example: "Sie bewirbt sich bei einer Firma in Hamburg.", tags: [arbeit]}
  - {type: verb, lemma: teilnehmen, praesens_3sg: nimmt teil, praeteritum: nahm teil,
     perfekt: hat teilgenommen, aux: haben, separable: true, rection: "teilnehmen an + Dat.",
     level: B1, source: seed,
     definition: "Bei einer Veranstaltung dabei sein und mitmachen.",
     example: "An dem Kurs nehmen zwölf Personen teil.", tags: [schule]}
  - {type: verb, lemma: empfehlen, praesens_3sg: empfiehlt, praeteritum: empfahl, perfekt: hat empfohlen,
     aux: haben, separable: false, level: B1, source: seed,
     definition: "Jemandem sagen, dass etwas gut ist und passt.",
     example: "Der Arzt hat mir mehr Bewegung empfohlen.", tags: [alltag]}
  - {type: verb, lemma: verschieben, praesens_3sg: verschiebt, praeteritum: verschob, perfekt: hat verschoben,
     aux: haben, separable: false, level: B1, source: seed,
     definition: "Etwas auf einen späteren Zeitpunkt legen.",
     example: "Können wir den Termin auf Freitag verschieben?", tags: [alltag]}
  - {type: verb, lemma: entscheiden, praesens_3sg: entscheidet, praeteritum: entschied, perfekt: hat entschieden,
     aux: haben, separable: false, rection: "sich entscheiden für + Akk.", level: B1, source: seed,
     definition: "Nach dem Überlegen eine von mehreren Möglichkeiten wählen.",
     example: "Wir haben uns für die kleinere Wohnung entschieden.", tags: [alltag]}
  - {type: verb, lemma: entstehen, praesens_3sg: entsteht, praeteritum: entstand, perfekt: ist entstanden,
     aux: sein, separable: false, level: B1, source: seed,
     definition: "Neu anfangen zu existieren.",
     example: "In der Umgebung entstehen viele neue Wohnungen.", tags: [wohnen]}
  - {type: verb, lemma: gelingen, praesens_3sg: gelingt, praeteritum: gelang, perfekt: ist gelungen,
     aux: sein, separable: false, rection: "gelingen + Dat.", level: B1, source: seed,
     definition: "Gut klappen; ein gutes Ergebnis haben.",
     example: "Der Kuchen ist mir dieses Mal wirklich gelungen.", tags: [alltag]}
  - {type: verb, lemma: beschreiben, praesens_3sg: beschreibt, praeteritum: beschrieb, perfekt: hat beschrieben,
     aux: haben, separable: false, level: B1, source: seed,
     definition: "Mit Worten genau sagen, wie etwas ist.",
     example: "Beschreiben Sie bitte kurz Ihre Erfahrung im Beruf.", tags: [sprache]}
  - {type: verb, lemma: sich erinnern, praesens_3sg: erinnert sich, praeteritum: erinnerte sich,
     perfekt: hat sich erinnert, aux: haben, separable: false, rection: "sich erinnern an + Akk.",
     level: B1, source: seed,
     definition: "Etwas aus der Vergangenheit wieder im Kopf haben.",
     example: "Ich erinnere mich gut an dieses Gespräch.", tags: [menschen]}
  - {type: verb, lemma: sich kümmern, praesens_3sg: kümmert sich, praeteritum: kümmerte sich,
     perfekt: hat sich gekümmert, aux: haben, separable: false, rection: "sich kümmern um + Akk.",
     level: B1, source: seed,
     definition: "Für jemanden oder etwas sorgen.",
     example: "Am Wochenende kümmere ich mich um die Rechnungen.", tags: [alltag]}
  - {type: verb, lemma: bestehen, praesens_3sg: besteht, praeteritum: bestand, perfekt: hat bestanden,
     aux: haben, separable: false, rection: "bestehen aus + Dat. / auf + Dat.", level: B1, source: seed,
     definition: "Eine Prüfung schaffen; oder aus Teilen zusammengesetzt sein.",
     example: "Sie hat die Prüfung mit einem guten Ergebnis bestanden.", tags: [schule]}
  - {type: verb, lemma: verzichten, praesens_3sg: verzichtet, praeteritum: verzichtete, perfekt: hat verzichtet,
     aux: haben, separable: false, rection: "verzichten auf + Akk.", level: B1, source: seed,
     definition: "Etwas absichtlich nicht nehmen oder nicht tun.",
     example: "Für die Umwelt verzichte ich oft auf das Auto.", tags: [umwelt]}
  - {type: verb, lemma: erreichen, praesens_3sg: erreicht, praeteritum: erreichte, perfekt: hat erreicht,
     aux: haben, separable: false, level: B1, source: seed,
     definition: "An ein Ziel kommen oder jemanden am Telefon bekommen.",
     example: "Unter dieser Nummer erreichen Sie mich bis achtzehn Uhr.", tags: [alltag]}
  - {type: verb, lemma: auffallen, praesens_3sg: fällt auf, praeteritum: fiel auf, perfekt: ist aufgefallen,
     aux: sein, separable: true, rection: "auffallen + Dat.", level: B1, source: seed,
     definition: "So sein, dass andere es sofort bemerken.",
     example: "Mir ist aufgefallen, dass die Rechnung zweimal kam.", tags: [alltag]}
  - {type: verb, lemma: vorschlagen, praesens_3sg: schlägt vor, praeteritum: schlug vor,
     perfekt: hat vorgeschlagen, aux: haben, separable: true, level: B1, source: seed,
     definition: "Eine Idee nennen, über die andere entscheiden sollen.",
     example: "Ich schlage vor, dass wir das Gespräch verschieben.", tags: [diskussion]}
  - {type: verb, lemma: sich beschweren, praesens_3sg: beschwert sich, praeteritum: beschwerte sich,
     perfekt: hat sich beschwert, aux: haben, separable: false, rection: "sich beschweren über + Akk. / bei + Dat.",
     level: B1, source: seed,
     definition: "Deutlich sagen, dass man mit etwas nicht zufrieden ist.",
     example: "Er hat sich bei der Firma über die Verspätung beschwert.", tags: [diskussion]}
  - {type: verb, lemma: ablehnen, praesens_3sg: lehnt ab, praeteritum: lehnte ab, perfekt: hat abgelehnt,
     aux: haben, separable: true, level: B1, source: seed,
     definition: "Nein zu einem Vorschlag oder Antrag sagen.",
     example: "Die Behörde hat meinen Antrag leider abgelehnt.", tags: [amt]}
  - {type: verb, lemma: zunehmen, praesens_3sg: nimmt zu, praeteritum: nahm zu, perfekt: hat zugenommen,
     aux: haben, separable: true, level: B1, source: seed,
     definition: "Mehr oder größer werden.",
     example: "Der Verkehr in der Stadt hat stark zugenommen.", tags: [umwelt]}
  - {type: verb, lemma: überweisen, praesens_3sg: überweist, praeteritum: überwies, perfekt: hat überwiesen,
     aux: haben, separable: false, level: B1, source: seed,
     definition: "Geld von einem Konto auf ein anderes schicken.",
     example: "Die Rechnung habe ich gestern überwiesen.", tags: [geld]}
  - {type: verb, lemma: kündigen, praesens_3sg: kündigt, praeteritum: kündigte, perfekt: hat gekündigt,
     aux: haben, separable: false, level: B1, source: seed,
     definition: "Einen Vertrag oder eine Stelle offiziell beenden.",
     example: "Sie hat den Vertrag zum Ende des Monats gekündigt.", tags: [arbeit, amt]}
  - {type: verb, lemma: sich gewöhnen, praesens_3sg: gewöhnt sich, praeteritum: gewöhnte sich,
     perfekt: hat sich gewöhnt, aux: haben, separable: false, rection: "sich gewöhnen an + Akk.",
     level: B1, source: seed,
     definition: "Mit der Zeit etwas normal finden.",
     example: "An das Wetter hier habe ich mich schnell gewöhnt.", tags: [alltag]}
  - {type: verb, lemma: verlangen, praesens_3sg: verlangt, praeteritum: verlangte, perfekt: hat verlangt,
     aux: haben, separable: false, level: B1, source: seed,
     definition: "Etwas fordern, weil man ein Recht darauf zu haben glaubt.",
     example: "Die Firma verlangt für die Reparatur zu viel Geld.", tags: [geld]}
  # ------------------------------------------------------------- Adjektive
  - {type: adjective, lemma: zuverlässig, level: B1, source: seed,
     definition: "So, dass man sich auf die Person oder Sache verlassen kann.",
     example: "Mein Kollege ist ruhig und sehr zuverlässig.", tags: [menschen]}
  - {type: adjective, lemma: anstrengend, level: B1, source: seed,
     definition: "So, dass es viel Kraft oder Energie kostet.",
     example: "Der Tag im Büro war heute besonders anstrengend.", tags: [arbeit]}
  - {type: adjective, lemma: günstig, level: B1, source: seed,
     definition: "Nicht teuer; oder gut passend.",
     example: "Wir haben eine günstige Wohnung in der Umgebung gefunden.", tags: [geld, wohnen]}
  - {type: adjective, lemma: dringend, level: B1, source: seed,
     definition: "So, dass es sofort gemacht werden muss.",
     example: "Ich muss dich dringend wegen des Vertrags sprechen.", tags: [alltag]}
  - {type: adjective, lemma: selbstständig, level: B1, source: seed,
     definition: "Ohne Hilfe von anderen; oder mit eigener Firma arbeitend.",
     example: "Seit zwei Jahren arbeitet sie selbstständig von zu Hause.", tags: [arbeit]}
  - {type: adjective, lemma: erfolgreich, level: B1, source: seed,
     definition: "So, dass man sein Ziel erreicht.",
     example: "Seine Bewerbung war erfolgreich, er fängt im Mai an.", tags: [arbeit]}
  - {type: adjective, lemma: verantwortlich, level: B1, source: seed, rection: "verantwortlich für + Akk.",
     definition: "So, dass man für eine Sache sorgen und sie erklären muss.",
     example: "Wer ist hier für die Rechnungen verantwortlich?", tags: [arbeit]}
  - {type: adjective, lemma: deutlich, level: B1, source: seed,
     definition: "Gut zu erkennen oder gut zu verstehen.",
     example: "Bitte sprechen Sie etwas lauter und deutlicher.", tags: [sprache]}
  - {type: adjective, lemma: ähnlich, level: B1, source: seed, rection: "ähnlich + Dat.",
     definition: "Fast gleich, aber nicht ganz.",
     example: "Dein Vorschlag ist meinem sehr ähnlich.", tags: [diskussion]}
  - {type: adjective, lemma: neugierig, level: B1, source: seed, rection: "neugierig auf + Akk.",
     definition: "So, dass man unbedingt etwas Neues wissen will.",
     example: "Ich bin neugierig auf das Ergebnis der Prüfung.", tags: [menschen]}
  # -------------------------------------------------------------- Wendungen
  - {type: phrase, lemma: Bescheid sagen, level: B1, source: seed,
     definition: "Jemandem eine Information geben, die er braucht.",
     example: "Sag mir bitte rechtzeitig Bescheid, wenn der Termin nicht klappt.", tags: [alltag]}
  - {type: phrase, lemma: eine Entscheidung treffen, level: B1, source: seed,
     definition: "Sich nach dem Überlegen für etwas festlegen.",
     example: "Bis Freitag müssen wir eine Entscheidung treffen.", tags: [diskussion]}
  - {type: phrase, lemma: Rücksicht nehmen, level: B1, source: seed, rection: "Rücksicht nehmen auf + Akk.",
     definition: "Bei seinem Verhalten an die anderen denken.",
     example: "Im Zug sollte man Rücksicht auf andere Reisende nehmen.", tags: [menschen]}
  - {type: phrase, lemma: es kommt darauf an, level: B1, source: seed,
     definition: "Die Antwort hängt von der Situation ab.",
     example: "Ob ich mitkomme, kommt darauf an, wie lange das Gespräch dauert.", tags: [diskussion]}
  - {type: phrase, lemma: Wert legen auf, level: B1, source: seed, rection: "Wert legen auf + Akk.",
     definition: "Eine Sache besonders wichtig finden.",
     example: "Meine Chefin legt großen Wert auf Pünktlichkeit.", tags: [arbeit]}
  # ------------------------------------------------------------- Grammatik
  - {type: grammar, lemma: Konjunktiv II (Gegenwart), level: B1, source: seed, tags: [grammatik, modus],
     definition: "würde + Infinitiv für Irreales und Wünsche; bei sein, haben, Modalverben die eigene Form: wäre, hätte, könnte, müsste.",
     example: "Wenn ich mehr Zeit hätte, würde ich einen Sprachkurs machen."}
  - {type: grammar, lemma: Konjunktiv II der Höflichkeit, level: B1, source: seed, tags: [grammatik, modus],
     definition: "Bitten klingen höflicher mit könnte, würde, wäre, hätte statt Präsens.",
     example: "Könnten Sie mir bitte sagen, wo ich den Antrag stellen muss?"}
  - {type: grammar, lemma: Passiv Präsens und Präteritum, level: B1, source: seed, tags: [grammatik, passiv],
     definition: "werden + Partizip II; wichtig ist die Handlung, nicht wer sie macht. Präteritum: wurde + Partizip II.",
     example: "Der Antrag wird von der Behörde geprüft."}
  - {type: grammar, lemma: Passiv mit Modalverb, level: B1, source: seed, tags: [grammatik, passiv],
     definition: "Modalverb + Partizip II + werden am Satzende.",
     example: "Die Rechnung muss bis Freitag überwiesen werden."}
  - {type: grammar, lemma: Relativsätze mit Präposition, level: B1, source: seed, tags: [grammatik, satzbau],
     definition: "Die Präposition steht vor dem Relativpronomen und bestimmt den Kasus.",
     example: "Das ist die Kollegin, mit der ich das Projekt mache."}
  - {type: grammar, lemma: Nebensätze mit weil, obwohl, damit, level: B1, source: seed, tags: [grammatik, satzbau],
     definition: "Nach diesen Konjunktionen steht das konjugierte Verb am Satzende.",
     example: "Ich nehme das Angebot, obwohl die Wohnung klein ist."}
  - {type: grammar, lemma: damit oder um zu, level: B1, source: seed, tags: [grammatik, satzbau],
     definition: "Gleiches Subjekt: um ... zu + Infinitiv. Verschiedene Subjekte: damit.",
     example: "Ich rufe früh an, damit die Behörde den Termin noch findet."}
  - {type: grammar, lemma: Wechselpräpositionen, level: B1, source: seed, tags: [grammatik, kasus],
     definition: "in, an, auf, über, unter, vor, hinter, neben, zwischen: Wohin? mit Akkusativ, Wo? mit Dativ.",
     example: "Ich lege den Zettel auf den Tisch; er liegt jetzt auf dem Tisch."}
  - {type: grammar, lemma: Verben mit Präposition und da-Wörter, level: B1, source: seed, tags: [grammatik, kasus],
     definition: "Sachen: worauf/darauf statt auf wen. Personen: auf wen / auf ihn.",
     example: "Worauf wartest du? Auf das Ergebnis. Ich warte schon lange darauf."}
  - {type: grammar, lemma: Adjektivdeklination, level: B1, source: seed, tags: [grammatik, kasus],
     definition: "Nach dem bestimmten Artikel endet das Adjektiv auf -e oder -en, nach ein/kein zeigt es das Geschlecht: ein guter Vorschlag.",
     example: "Der neue Vertrag und ein guter Vorschlag helfen uns beiden."}
  - {type: grammar, lemma: n-Deklination, level: B1, source: seed, tags: [grammatik, kasus],
     definition: "Manche maskulinen Nomen bekommen außer im Nominativ Singular ein -n: der Kollege, den Kollegen.",
