# B1-Deck — Wortschatz und Grammatik für Alltag, Beruf und Ämter (Niveau B1).
# Frei editierbar: Artikel, Plural, Formen und Sätze kannst du jederzeit ändern.
# Import: python -m flashcard seed --level b1
cards:

  # ---------------------------------------------------------------- Grammatik
  - type: grammar
    lemma: "Adjektive ohne Artikel"
    level: B1
    source: seed
    tags: [grammatik, adjektive]
    definition: >-
      Steht kein Artikel vor dem Adjektiv, muss das Adjektiv selbst den Kasus zeigen und bekommt
      fast überall die Endung des bestimmten Artikels, also -er, -e, -es, -en, -em. Das kommt
      typisch bei Stoffnamen, im Plural ohne Artikel und nach Mengenangaben vor.
    examples:
      - "Frischer Kaffee steht schon auf dem Tisch."
      - "Bei schlechtem Wetter bleiben wir lieber zu Hause."
      - "Sie sucht günstige Wohnungen in ruhiger Lage."
  - type: grammar
    lemma: "Art und Weise mit indem"
    level: B1
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      indem antwortet auf die Frage wie oder wodurch und nennt das Mittel, mit dem man ein Ziel
      erreicht. Das Subjekt ist meistens in beiden Sätzen gleich, das Verb steht am Ende. Nicht
      verwechseln mit während, das nur die Zeit angibt.
    examples:
      - "Man spart Strom, indem man das Licht ausschaltet."
      - "Sie verbesserte ihr Deutsch, indem sie jeden Tag laut las."
      - "Wir lösten das Problem, indem wir direkt mit dem Vermieter sprachen."
  - type: grammar
    lemma: "brauchen mit zu"
    level: B1
    source: seed
    tags: [grammatik, verben]
    definition: >-
      brauchen ersetzt müssen in verneinten Sätzen und steht dann mit zu plus Infinitiv. Es
      erscheint fast nur mit nicht, nur, kaum oder erst. Positiv ohne Verneinung sagt man müssen.
      In der gesprochenen Sprache fällt das zu oft weg, in der Prüfung schreibt man es besser.
    examples:
      - "Du brauchst heute nicht zu kommen."
      - "Sie brauchen das Formular nur zu unterschreiben."
      - "Wir brauchen den Antrag erst nächste Woche abzugeben."
  - type: grammar
    lemma: "Folge mit so dass"
    level: B1
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      sodass nennt die Folge einer Handlung; das Verb steht am Ende des Nebensatzes. Getrennt
      geschrieben wird so ... dass, wenn so zu einem Adjektiv gehört und dieses betont. Eine
      ähnliche Bedeutung hat deshalb, das aber im Hauptsatz steht.
    examples:
      - "Der Zug hatte Verspätung, sodass wir das Konzert verpassten."
      - "Es war so kalt, dass die Kinder drinnen blieben."
      - "Sie sprach so leise, dass niemand sie verstehen konnte."
  - type: grammar
    lemma: "Futur I und Vermutung"
    level: B1
    source: seed
    tags: [grammatik, zeiten]
    definition: >-
      werden plus Infinitiv steht für Absichten, Versprechen und Vorhersagen. Sehr häufig drückt
      es aber eine Vermutung über die Gegenwart aus, meist zusammen mit wohl, sicher oder
      wahrscheinlich. Für einfache Zukunftspläne genügt im Alltag das Präsens mit Zeitangabe.
    examples:
      - "Ich werde mich morgen um die Versicherung kümmern."
      - "Sie wird wohl im Stau stehen."
      - "In den nächsten Jahren werden die Mieten weiter steigen."
  - type: grammar
    lemma: "Genitiv"
    level: B1
    source: seed
    tags: [grammatik, kasus]
    definition: >-
      Der Genitiv zeigt Besitz und Zugehörigkeit und steht hinter dem Nomen, das er näher
      bestimmt. Maskuline und neutrale Nomen bekommen -s oder -es, feminine bleiben unverändert.
      Mit Genitiv stehen die Präpositionen wegen, während, trotz, statt und aufgrund. Im Gespräch
      ersetzt man den Genitiv oft durch von plus Dativ.
    examples:
      - "Das Auto meines Bruders steht in der Garage."
      - "Während der Besprechung klingelte ständig ein Telefon."
      - "Die Farbe der Wände gefällt mir nicht."
  - type: grammar
    lemma: "Indirekte Fragen"
    level: B1
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      Eine Frage im Nebensatz wird bei Ja-Nein-Fragen mit ob eingeleitet, bei W-Fragen mit dem
      Fragewort. Das Verb steht am Ende. Solche Sätze folgen auf Verben wie fragen, wissen wollen,
      sich erkundigen und machen eine direkte Frage höflicher.
    examples:
      - "Er hat gefragt, ob wir den Termin verschieben können."
      - "Wissen Sie, wann der nächste Bus abfährt?"
      - "Ich weiß nicht, warum die Rechnung noch nicht da ist."
  - type: grammar
    lemma: "Infinitiv mit zu"
    level: B1
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      Nach vielen Verben und Ausdrücken steht ein Infinitiv mit zu am Satzende, zum Beispiel nach
      versuchen, vergessen, anfangen, hoffen, Lust haben, es ist wichtig. Bei trennbaren Verben
      steht zu in der Mitte (abzugeben). Ohne zu stehen die Modalverben sowie sehen, hören,
      lassen, gehen und bleiben.
    examples:
      - "Wir haben versucht, den Termin zu verschieben."
      - "Es ist wichtig, die Unterlagen rechtzeitig abzugeben."
      - "Sie hat vergessen, die Rechnung zu bezahlen."
  - type: grammar
    lemma: "je desto"
    level: B1
    source: seed
    tags: [grammatik, adjektive]
    definition: >-
      je plus Komparativ leitet einen Nebensatz mit Verb am Ende ein, desto oder umso plus
      Komparativ folgt im Hauptsatz mit dem Verb direkt danach. Die beiden Größen verändern sich
      zusammen. Die Reihenfolge je-Satz zuerst ist fest.
    examples:
      - "Je früher wir losfahren, desto weniger Verkehr haben wir."
      - "Je öfter man spricht, umso sicherer wird man."
      - "Je länger das Gespräch dauerte, desto müder wurden alle."
  - type: grammar
    lemma: "Kausale Verbindungen"
    level: B1
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      weil und da leiten einen Nebensatz mit Verb am Ende ein; da steht meist vorn und nennt einen
      schon bekannten Grund. denn verbindet zwei Hauptsätze ohne Umstellung. deshalb und deswegen
      nennen die Folge und ziehen das Verb direkt hinter sich. wegen ist eine Präposition mit
      Genitiv.
    examples:
      - "Da der Zug ausfiel, mussten wir ein Taxi nehmen."
      - "Wegen des Umzugs habe ich diese Woche wenig Zeit."
      - "Die Miete stieg stark, deshalb suchen sie etwas Kleineres."
  - type: grammar
    lemma: "Konditionale Verbindungen"
    level: B1
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      wenn und falls nennen eine Bedingung; falls betont, dass die Sache unsicher ist. Der wenn-
      Satz kann auch ohne Konjunktion gebildet werden, dann beginnt er mit dem Verb. sonst und
      andernfalls stehen im Hauptsatz und nennen die Folge, wenn die Bedingung nicht erfüllt wird.
    examples:
      - "Falls es morgen regnet, verschieben wir den Ausflug."
      - "Sollten Sie Fragen haben, rufen Sie uns bitte an."
      - "Wir müssen jetzt gehen, sonst verpassen wir den Anschluss."
  - type: grammar
    lemma: "Konjunktiv II der Gegenwart"
    level: B1
    source: seed
    tags: [grammatik, modus]
    definition: >-
      Der Konjunktiv II spricht über Irreales, Wünsche und Ratschläge. Die normale Form ist würde
      + Infinitiv. Eine eigene Form haben sein (wäre), haben (hätte), werden (würde), die
      Modalverben (könnte, müsste, dürfte, sollte, wollte) und einige starke Verben (käme, ginge,
      wüsste). Im irrealen Bedingungssatz steht der Konjunktiv in beiden Teilen.
    examples:
      - "Wenn ich mehr Zeit hätte, würde ich einen Sprachkurs machen."
      - "An deiner Stelle würde ich mit dem Vermieter sprechen."
      - "Es wäre schön, wenn du am Samstag mitkommen könntest."
  - type: grammar
    lemma: "Konjunktiv II der Vergangenheit"
    level: B1
    source: seed
    tags: [grammatik, modus]
    definition: >-
      Für Irreales in der Vergangenheit gibt es nur eine Form, egal ob Perfekt oder Präteritum
      gemeint ist. Sie besteht aus hätte oder wäre plus Partizip II. würde wird hier nie benutzt.
      Mit einem Modalverb steht am Ende ein doppelter Infinitiv. Typisch für Vorwürfe und
      verpasste Gelegenheiten.
    examples:
      - "Wenn ich früher losgefahren wäre, hätte ich den Zug erreicht."
      - "Du hättest mir ruhig Bescheid sagen können."
      - "Beinahe hätten wir den Termin vergessen."
  - type: grammar
    lemma: "Konzessive Verbindungen"
    level: B1
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      Sie sagen, dass etwas trotz eines Gegengrunds passiert. obwohl leitet einen Nebensatz ein,
      das Verb steht am Ende. trotzdem und dennoch stehen im Hauptsatz auf Position 1, danach
      folgt sofort das Verb. trotz ist eine Präposition mit Genitiv und steht vor einem Nomen.
    examples:
      - "Obwohl die Wohnung klein ist, nehmen wir sie."
      - "Das Wetter war schlecht, trotzdem sind wir gewandert."
      - "Trotz des starken Regens kamen alle pünktlich."
  - type: grammar
    lemma: "lassen"
    level: B1
    source: seed
    tags: [grammatik, verben]
    definition: >-
      lassen hat drei Bedeutungen. Es heißt veranlassen (etwas machen lassen), erlauben und
      zulassen sowie mit sich die Möglichkeit (das lässt sich reparieren). Der zweite Infinitiv
      steht ohne zu am Satzende. Im Perfekt steht statt des Partizips ein doppelter Infinitiv,
      also hat machen lassen.
    examples:
      - "Wir lassen die Waschmaschine morgen reparieren."
      - "Meine Eltern lassen die Kinder länger fernsehen."
      - "Das Problem lässt sich in zehn Minuten lösen."
  - type: grammar
    lemma: "man und andere Passiv-Ersatzformen"
    level: B1
    source: seed
    tags: [grammatik, passiv]
    definition: >-
      Statt des Passivs benutzt man im Gespräch oft man plus Aktiv. Weitere Ersatzformen sind sich
      lassen plus Infinitiv (kann gemacht werden), sein plus zu plus Infinitiv (muss oder kann
      gemacht werden) und Adjektive auf -bar. Sie klingen leichter als das volle Passiv.
    examples:
      - "In dieser Stadt kann man gut ohne Auto leben."
      - "Das Problem lässt sich schnell lösen."
      - "Die Formulare sind bis Montag abzugeben."
  - type: grammar
    lemma: "Modalverben als Vermutung"
    level: B1
    source: seed
    tags: [grammatik, modus]
    definition: >-
      Modalverben können auch sagen, wie sicher eine Aussage ist. muss bedeutet fast sicher,
      dürfte und müsste ziemlich wahrscheinlich, könnte möglich, kann nicht ausgeschlossen. Mit
      einer Vergangenheit steht dahinter Partizip II plus haben oder sein.
    examples:
      - "Das Paket müsste morgen ankommen."
      - "Sie kann das Formular nicht bekommen haben."
      - "Bei diesem Verkehr dürfte er sich verspäten."
  - type: grammar
    lemma: "n-Deklination"
    level: B1
    source: seed
    tags: [grammatik, kasus]
    definition: >-
      Eine Gruppe maskuliner Nomen bekommt in allen Fällen außer dem Nominativ Singular ein -n
      oder -en. Dazu gehören Personen auf -e (Kollege, Kunde, Junge), Nomen auf -ent, -ant, -ist,
      -oge sowie Herr, Mensch, Nachbar, Bauer. Der häufigste Fehler ist die fehlende Endung im
      Akkusativ und Dativ.
    examples:
      - "Ich habe den Kollegen nach seiner Meinung gefragt."
      - "Mit dem Kunden wurde ein neuer Termin vereinbart."
      - "Der Praktikant hilft dem Studenten bei der Arbeit."
  - type: grammar
    lemma: "Nomen-Verb-Verbindungen"
    level: B1
    source: seed
    tags: [grammatik, wortschatz]
    definition: >-
      Viele feste Wendungen bestehen aus einem Nomen und einem blassen Verb, zum Beispiel eine
      Entscheidung treffen, einen Antrag stellen, in Kontakt bleiben, zur Verfügung stehen,
      Rücksicht nehmen. Sie klingen im Amt und im Beruf natürlicher als das einfache Verb; Artikel
      und Präposition muss man mitlernen.
    examples:
      - "Bis Freitag müssen wir eine Entscheidung treffen."
      - "Beim Amt kann man den Antrag auch online stellen."
      - "Für Rückfragen stehe ich Ihnen gern zur Verfügung."
  - type: grammar
    lemma: "Objekte im Dativ und Akkusativ"
    level: B1
    source: seed
    tags: [grammatik, kasus]
    definition: >-
      Verben wie geben, schicken, erklären, zeigen, empfehlen haben zwei Objekte. Die Person steht
      im Dativ, die Sache im Akkusativ. Ist die Sache ein Pronomen, rückt sie nach vorn, also gib
      es mir. Manche Verben verlangen dagegen nur den Dativ, zum Beispiel helfen, gefallen und
      gehören.
    examples:
      - "Der Vermieter hat uns den Vertrag erklärt."
      - "Kannst du mir das Formular schicken?"
      - "Zeig es ihm bitte morgen im Büro."
  - type: grammar
    lemma: "ohne zu und statt zu"
    level: B1
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      ohne plus zu plus Infinitiv sagt, dass etwas Erwartetes nicht passiert; statt oder anstatt
      plus zu plus Infinitiv nennt eine Alternative, die man nicht gewählt hat. Beide brauchen
      dasselbe Subjekt wie der Hauptsatz. Sonst benutzt man ohne dass oder anstatt dass mit Verb
      am Ende.
    examples:
      - "Er ging aus dem Zimmer, ohne ein Wort zu sagen."
      - "Statt zu telefonieren, hat sie eine lange Mail geschrieben."
      - "Wir sind losgefahren, ohne die Karte mitzunehmen."
  - type: grammar
    lemma: "Partizip als Adjektiv"
    level: B1
    source: seed
    tags: [grammatik, adjektive]
    definition: >-
      Beide Partizipien können wie Adjektive vor einem Nomen stehen und bekommen dann normale
      Adjektivendungen. Das Partizip I (Infinitiv plus d) ist aktiv und gleichzeitig, etwa
      spielende Kinder. Das Partizip II ist passiv oder abgeschlossen, etwa die reparierte
      Waschmaschine.
    examples:
      - "Die spielenden Kinder machten viel Lärm."
      - "Das reparierte Fahrrad steht wieder im Keller."
      - "Wir suchen einen gut bezahlten Nebenjob."
  - type: grammar
    lemma: "Passiv mit Modalverb"
    level: B1
    source: seed
    tags: [grammatik, passiv]
    definition: >-
      Modalverben lassen sich mit dem Passiv verbinden. Das Modalverb wird konjugiert, am Satzende
      stehen Partizip II und der Infinitiv werden. In der Vergangenheit benutzt man dafür meistens
      das Präteritum des Modalverbs, weil das Perfekt sehr schwerfällig klingt.
    examples:
      - "Die Rechnung muss bis Freitag überwiesen werden."
      - "Das Formular kann auch online ausgefüllt werden."
      - "Der Termin musste leider verschoben werden."
  - type: grammar
    lemma: "Passiv Perfekt"
    level: B1
    source: seed
    tags: [grammatik, passiv]
    definition: >-
      Im Perfekt Passiv steht sein plus Partizip II plus worden am Ende, nicht geworden. Man
      benutzt es, wenn das Ergebnis einer abgeschlossenen Handlung wichtig ist. Der häufigste
      Fehler ist die Verwechslung mit dem Zustandspassiv, das kein worden hat.
    examples:
      - "Die Rechnung ist schon letzte Woche bezahlt worden."
      - "Unser Vertrag ist leider noch nicht unterschrieben worden."
      - "Wann ist das Paket abgeschickt worden?"
  - type: grammar
    lemma: "Passiv Präsens und Präteritum"
    level: B1
    source: seed
    tags: [grammatik, passiv]
    definition: >-
      Das Passiv rückt die Handlung in den Mittelpunkt; wer sie tut, ist unwichtig oder unbekannt.
      Gebildet wird es mit werden plus Partizip II am Satzende, im Präteritum mit wurde. Das
      Akkusativobjekt des Aktivsatzes wird zum Subjekt. Wer handelt, steht bei Personen mit von +
      Dativ, bei Ursachen mit durch + Akkusativ.
    examples:
      - "Der Antrag wird von der Behörde sorgfältig geprüft."
      - "Die alte Schule wurde vor zwei Jahren renoviert."
      - "In diesem Betrieb werden jedes Jahr zwanzig Leute ausgebildet."
  - type: grammar
    lemma: "Plusquamperfekt und nachdem"
    level: B1
    source: seed
    tags: [grammatik, zeiten]
    definition: >-
      Das Plusquamperfekt zeigt, dass etwas noch vor einem anderen Ereignis in der Vergangenheit
      passiert ist. Gebildet wird es mit hatte oder war plus Partizip II. Typisch ist der Satz mit
      nachdem, in dem die Zeiten um eine Stufe versetzt sind, zum Beispiel Plusquamperfekt im
      Nebensatz und Präteritum oder Perfekt im Hauptsatz.
    examples:
      - "Nachdem ich den Antrag abgeschickt hatte, wartete ich vier Wochen."
      - "Sie war schon eingeschlafen, als das Telefon klingelte."
      - "Wir hatten die Karten gekauft, bevor der Film ausverkauft war."
  - type: grammar
    lemma: "Relativpronomen im Genitiv"
    level: B1
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      dessen (maskulin und neutrum) und deren (feminin und Plural) drücken einen Besitz aus. Das
      folgende Nomen steht ohne Artikel direkt dahinter. Die Form richtet sich nach dem Bezugswort
      vorn, nicht nach dem Nomen danach, was die häufigste Fehlerquelle ist.
    examples:
      - "Das ist der Kollege, dessen Auto vor dem Haus steht."
      - "Die Nachbarin, deren Kinder hier spielen, ist sehr nett."
      - "Wir sprachen mit Leuten, deren Wohnungen zu teuer geworden sind."
  - type: grammar
    lemma: "Relativsätze"
    level: B1
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      Der Relativsatz beschreibt ein Nomen genauer; das Verb steht am Ende. Das Relativpronomen
      hat das Genus und den Numerus des Bezugsworts, aber den Kasus, den das Verb im Relativsatz
      verlangt. Die Formen sind wie der bestimmte Artikel, außer im Dativ Plural (denen) und im
      Genitiv (dessen, deren).
    examples:
      - "Das ist der Kollege, der neben mir sitzt."
      - "Die Wohnung, die wir gemietet haben, liegt sehr ruhig."
      - "Der Nachbar, dem ich geholfen habe, hat sich bedankt."
  - type: grammar
    lemma: "Relativsätze mit Präposition"
    level: B1
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      Verlangt das Verb im Relativsatz eine Präposition, steht sie vor dem Relativpronomen und
      bestimmt dessen Kasus. Bei Sachen kann man auch wo- plus Präposition benutzen (worauf,
      womit), bei Personen nie. Für Orte ist wo möglich und oft eleganter als in dem.
    examples:
      - "Das ist die Kollegin, mit der ich das Projekt mache."
      - "Der Termin, auf den wir gewartet haben, wurde abgesagt."
      - "Die Stadt, in der sie aufgewachsen ist, liegt im Süden."
  - type: grammar
    lemma: "Temporale Nebensätze"
    level: B1
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      als für ein einmaliges Ereignis in der Vergangenheit, wenn für Wiederholung und Zukunft,
      während für Gleichzeitigkeit, bevor für das Spätere im Hauptsatz, nachdem für das Frühere,
      seit oder seitdem für den Anfangspunkt, bis für das Ende. In allen steht das Verb am
      Satzende.
    examples:
      - "Als ich in Berlin ankam, regnete es stark."
      - "Bevor du gehst, mach bitte das Fenster zu."
      - "Seitdem sie den neuen Job hat, ist sie viel entspannter."
  - type: grammar
    lemma: "um zu und damit"
    level: B1
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      Beide nennen den Zweck einer Handlung. Ist das Subjekt in beiden Teilen dasselbe, benutzt
      man um plus zu plus Infinitiv. Sind die Subjekte verschieden, muss damit stehen; im damit-
      Satz steht das Verb am Ende. Nach um zu darf kein eigenes Subjekt folgen.
    examples:
      - "Sie lernt jeden Tag, um die Prüfung zu bestehen."
      - "Ich rufe früh an, damit die Behörde noch einen Termin hat."
      - "Um pünktlich zu sein, nehmen wir den früheren Zug."
  - type: grammar
    lemma: "Verben mit Präposition und da-Wörter"
    level: B1
    source: seed
    tags: [grammatik, kasus]
    definition: >-
      Viele Verben haben eine feste Präposition, die den Kasus bestimmt, etwa warten auf plus
      Akkusativ oder teilnehmen an plus Dativ. Geht es um eine Sache, fragt man mit wo plus
      Präposition und antwortet mit da plus Präposition. Bei Personen bleiben Präposition und
      Fragewort getrennt. Vor einem Vokal steht ein r, also worauf und darauf.
    examples:
      - "Worauf wartest du noch?"
      - "Auf das Ergebnis warten wir schon lange, alle sprechen davon."
      - "Über wen habt ihr euch beschwert?"
  - type: grammar
    lemma: "Wortstellung im Mittelfeld"
    level: B1
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      Zwischen Verb und Satzende gilt eine Reihenfolge. Angaben kommen meist als temporal, kausal,
      modal, lokal. Pronomen stehen vor Nomen, und beim Dativ und Akkusativ gilt Nomen nach Nomen
      erst Dativ, bei zwei Pronomen erst Akkusativ. Bekanntes steht vorn, Neues hinten.
    examples:
      - "Sie hat mir gestern die Unterlagen geschickt."
      - "Wegen des Regens fahren wir heute mit dem Bus zur Arbeit."
      - "Ich gebe es dir morgen zurück."
  - type: grammar
    lemma: "Zustandspassiv"
    level: B1
    source: seed
    tags: [grammatik, passiv]
    definition: >-
      Das Zustandspassiv besteht aus sein plus Partizip II und beschreibt das Ergebnis einer
      Handlung, nicht die Handlung selbst. Der Unterschied ist deutlich bei Türen und Läden. Die
      Tür wird geschlossen beschreibt den Vorgang, die Tür ist geschlossen den Zustand danach.
    examples:
      - "Die Geschäfte sind am Sonntag geschlossen."
      - "Der Tisch ist für sechs Personen gedeckt."
      - "Alle Formulare sind bereits ausgefüllt."
  - type: grammar
    lemma: "Zweiteilige Konnektoren"
    level: B1
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      entweder ... oder nennt eine Alternative, nicht nur ... sondern auch eine Steigerung, weder
      ... noch eine doppelte Verneinung ohne weiteres nicht, sowohl ... als auch eine Verbindung,
      zwar ... aber eine Einschränkung. Beide Teile müssen zur gleichen Wortart passen. Nach
      sondern steht immer eine vorherige Verneinung.
    examples:
      - "Die Wohnung ist nicht nur günstig, sondern auch ruhig."
      - "Entweder rufst du an oder du schreibst eine Mail."
      - "Er spricht weder Französisch noch Spanisch."

