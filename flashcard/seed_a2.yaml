# A2-Deck — Grundwortschatz und Grammatik (Niveau A2).
# Frei editierbar: Artikel, Plural, Formen und Sätze kannst du jederzeit ändern.
# Import: python -m flashcard seed --level a2
cards:

  # ---------------------------------------------------------------- Grammatik
  - type: grammar
    lemma: "Adjektivendungen nach dem bestimmten Artikel"
    level: A2
    source: seed
    tags: [grammatik, adjektive]
    definition: >-
      Nach der, die, das, diese, jede, alle gibt es nur zwei Endungen: -e und -en. -e steht im
      Nominativ Singular aller Geschlechter und im Akkusativ feminin und neutrum. Überall sonst
      steht -en, also im Akkusativ maskulin, im ganzen Dativ und im ganzen Plural.
    examples:
      - "Der neue Kollege arbeitet sehr genau."
      - "Ich nehme den kleinen Tisch am Fenster."
      - "Mit dem alten Fahrrad fährt sie zur Arbeit."
  - type: grammar
    lemma: "Adjektivendungen nach ein, kein und mein"
    level: A2
    source: seed
    tags: [grammatik, adjektive]
    definition: >-
      Wo ein, kein oder ein Possessivartikel das Geschlecht nicht zeigt, muss das Adjektiv es
      zeigen: ein guter Freund (maskulin), ein kleines Kind (neutrum), eine große Wohnung
      (feminin). Im Akkusativ maskulin steht -en, im Dativ überall -en, im Plural nach kein/meine
      ebenfalls -en.
    examples:
      - "Ein guter Freund hilft auch am Wochenende."
      - "Wir suchen eine größere Wohnung mit Balkon."
      - "Sie fährt mit einem alten Auto zur Arbeit."
  - type: grammar
    lemma: "Akkusativ oder Dativ"
    level: A2
    source: seed
    tags: [grammatik, kasus]
    definition: >-
      Das Verb bestimmt den Kasus. Die meisten Verben haben ein Akkusativobjekt (Wen? Was?): den,
      einen, meinen. Eine kleine Gruppe verlangt den Dativ (Wem?): helfen, danken, gehören,
      gefallen, passen, antworten, gratulieren. Bei zwei Objekten steht die Person im Dativ und
      die Sache im Akkusativ: Ich gebe dem Kind das Buch.
    examples:
      - "Der Nachbar hat mir bei den Möbeln geholfen."
      - "Meine Schwester kauft einen neuen Schrank."
      - "Wir schenken unseren Eltern eine Reise."
  - type: grammar
    lemma: "es gibt"
    level: A2
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      es gibt sagt, dass etwas existiert oder vorhanden ist, und steht immer mit dem Akkusativ, im
      Singular und im Plural gleich: es gibt einen Park, es gibt viele Geschäfte. Im Perfekt heißt
      es es hat gegeben, im Präteritum es gab. Für eine bestimmte Lage benutzt man dagegen sein:
      Der Park ist hinter dem Bahnhof.
    examples:
      - "In unserem Viertel gibt es einen schönen Park."
      - "Gibt es hier in der Nähe eine Apotheke?"
      - "Gestern gab es im Supermarkt keine frischen Brötchen."
  - type: grammar
    lemma: "Fragen mit W-Wort und Ja-Nein-Fragen"
    level: A2
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      Bei der W-Frage steht das Fragewort auf Position 1 und das Verb auf Position 2: Wann kommst
      du? Bei der Ja-Nein-Frage beginnt der Satz mit dem Verb: Kommst du mit? Auf eine verneinte
      Frage antwortet man mit doch, wenn man widerspricht. Wichtige Fragewörter: wann, wo, wohin,
      woher, warum, wie, wie lange, wie oft, welcher, was für ein.
    examples:
      - "Wohin fahrt ihr in den Ferien?"
      - "Hast du den Termin schon abgesagt?"
      - "Hast du keinen Hunger? Doch, sehr!"
  - type: grammar
    lemma: "Höfliche Bitten mit Konjunktiv II"
    level: A2
    source: seed
    tags: [grammatik, modus]
    definition: >-
      Für höfliche Bitten und Wünsche benutzt man könnte, würde, hätte, wäre und möchte statt des
      Präsens. Formen: ich könnte, du könntest, er könnte; ich hätte gern, ich wäre, ich würde
      gern. Das macht Fragen im Amt, im Geschäft und am Telefon deutlich freundlicher.
    examples:
      - "Könnten Sie mir bitte den Weg zeigen?"
      - "Ich hätte gern einen Termin am Montag."
      - "Würdest du mir kurz mit dem Koffer helfen?"
  - type: grammar
    lemma: "Imperativ"
    level: A2
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      Der Imperativ steht an Position 1. Bei du fällt das Pronomen weg und meist auch das -e
      (komm!, geh!); Verben mit e/i-Wechsel behalten den Wechsel ohne Umlaut (nimm!, gib!). Bei
      ihr ist die Form gleich wie im Präsens (kommt!). Bei Sie steht das Pronomen hinter dem Verb
      (Kommen Sie!). bitte macht die Aufforderung höflicher.
    examples:
      - "Komm bitte pünktlich zum Termin!"
      - "Nehmt eure Jacken mit, es wird kalt!"
      - "Warten Sie bitte einen Moment."
  - type: grammar
    lemma: "Komparativ und Superlativ"
    level: A2
    source: seed
    tags: [grammatik, adjektive]
    definition: >-
      Komparativ mit -er, Superlativ mit am -sten oder der/die/das -ste. Kurze Adjektive bekommen
      oft einen Umlaut: alt, älter, am ältesten. Unregelmäßig sind gut/besser/am besten,
      viel/mehr/am meisten, gern/lieber/am liebsten, hoch/höher, nah/näher. Vor einem Nomen
      bekommt auch die Vergleichsform noch eine Adjektivendung.
    examples:
      - "Mein Bruder ist zwei Jahre älter als ich."
      - "Im Sommer sind die Tage am längsten."
      - "Das ist das beste Restaurant in der Stadt."
  - type: grammar
    lemma: "Konnektoren im Hauptsatz"
    level: A2
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      deshalb, deswegen, darum (Folge), trotzdem (Gegensatz), dann (Reihenfolge) und sonst
      (andernfalls) sind keine Nebensatz-Konjunktionen: sie stehen auf Position 1, danach folgt
      sofort das konjugierte Verb und erst dann das Subjekt. Anders als bei und, aber, oder, denn,
      sondern, die vor dem ganzen Satz stehen und nichts verändern.
    examples:
      - "Es hat stark geregnet, deshalb sind wir zu Hause geblieben."
      - "Der Termin war wichtig, trotzdem kam er zu spät."
      - "Beeil dich, sonst verpassen wir den Zug."
  - type: grammar
    lemma: "Modalverben"
    level: A2
    source: seed
    tags: [grammatik, verben]
    definition: >-
      können (Fähigkeit), müssen (Notwendigkeit), wollen (Wille), dürfen (Erlaubnis), sollen
      (Auftrag, Rat) und möchten (Wunsch). Das Modalverb steht an Position 2, der zweite Infinitiv
      ohne zu am Satzende. Im Singular ändert sich der Vokal (ich kann, ich muss), und die 1. und
      3. Person haben keine Endung.
    examples:
      - "Meine Tochter kann schon ziemlich gut schwimmen."
      - "Am Wochenende müssen wir die Wohnung putzen."
      - "Hier darf man leider nicht parken."
  - type: grammar
    lemma: "Nebensatz mit dass"
    level: A2
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      dass macht aus einem Satz ein Objekt und steht nach Verben des Sagens, Denkens und Fühlens:
      glauben, denken, hoffen, wissen, sagen, finden. Das Verb steht am Ende. Vor dass steht immer
      ein Komma. Nach ich glaube und ich denke kann dass auch weggelassen werden; dann gilt die
      normale Wortstellung.
    examples:
      - "Ich hoffe, dass das Wetter am Samstag besser wird."
      - "Meine Chefin sagt, dass die Besprechung später anfängt."
      - "Wir finden, dass die Wohnung zu teuer ist."
  - type: grammar
    lemma: "Nebensatz mit weil"
    level: A2
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      weil leitet einen Nebensatz ein: das konjugierte Verb steht ganz am Ende. denn hat dieselbe
      Bedeutung, ist aber eine Hauptsatz-Konjunktion und ändert die Wortstellung nicht. Steht der
      weil-Satz vorn, folgt direkt das Verb des Hauptsatzes. Trennbare Verben bleiben im Nebensatz
      zusammen.
    examples:
      - "Ich bleibe heute zu Hause, weil ich krank bin."
      - "Weil der Zug Verspätung hatte, kam sie zu spät."
      - "Er nimmt das Fahrrad, denn der Bus ist teuer."
  - type: grammar
    lemma: "Nebensatz mit wenn"
    level: A2
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      wenn bedeutet zweierlei: eine Bedingung (wenn das Wetter gut ist) und eine wiederholte Zeit
      in Gegenwart oder Zukunft (immer wenn). Für ein einmaliges Ereignis in der Vergangenheit
      benutzt man als. Das Verb steht am Ende des wenn-Satzes; steht der Nebensatz vorn, beginnt
      der Hauptsatz mit dem Verb, oft mit dann.
    examples:
      - "Wenn das Wetter schön ist, gehen wir schwimmen."
      - "Ruf mich an, wenn du angekommen bist."
      - "Als ich klein war, wohnten wir auf dem Land."
  - type: grammar
    lemma: "Negation mit nicht oder kein"
    level: A2
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      kein verneint Nomen mit unbestimmtem Artikel oder ohne Artikel und wird wie ein dekliniert:
      kein Auto, keine Zeit, keinen Hunger. Alles andere verneint nicht. nicht steht vor
      Adjektiven, Ortsangaben und dem zweiten Verbteil, aber nach dem konjugierten Verb und nach
      Zeitangaben. Am Satzende steht nicht, wenn der ganze Satz verneint wird.
    examples:
      - "Wir haben heute leider keine Zeit."
      - "Der Film war überhaupt nicht interessant."
      - "Am Wochenende arbeite ich normalerweise nicht."
  - type: grammar
    lemma: "Nicht trennbare Verben"
    level: A2
    source: seed
    tags: [grammatik, verben]
    definition: >-
      Die Präfixe be-, emp-, ent-, er-, ge-, miss-, ver-, zer- sind nie trennbar und nie betont.
      Diese Verben bilden das Partizip II ohne ge-: bezahlt, verstanden, erzählt, bekommen.
      Achtung bei Paaren wie ÜBERsetzen (ans andere Ufer bringen, trennbar) und überSETZEN (in
      eine andere Sprache, nicht trennbar).
    examples:
      - "Meine Kollegin hat die Rechnung schon bezahlt."
      - "Hast du die Frage des Lehrers verstanden?"
      - "Der Kellner empfiehlt heute die Suppe."
  - type: grammar
    lemma: "Ordinalzahlen und Datum"
    level: A2
    source: seed
    tags: [grammatik, zeit]
    definition: >-
      Ordinalzahlen bildet man bis 19 mit -t (der vierte), ab 20 mit -st (der zwanzigste);
      unregelmäßig sind erste, dritte, siebte, achte. Beim Datum sagt man der erste Mai
      (Nominativ) und am ersten Mai (Dativ). Geschrieben steht ein Punkt nach der Zahl: am 1. Mai.
    examples:
      - "Heute ist der dritte September."
      - "Am fünfzehnten Juni fängt mein Urlaub an."
      - "Sie wohnt im siebten Stock."
  - type: grammar
    lemma: "Perfekt mit haben oder sein"
    level: A2
    source: seed
    tags: [grammatik, zeiten]
    definition: >-
      Das Perfekt ist die normale Vergangenheit im Gespräch: haben oder sein an Position 2 und das
      Partizip II am Satzende. Die meisten Verben nehmen haben. Sein nehmen Verben der Bewegung
      von A nach B (gehen, fahren, kommen), der Zustandsänderung (aufstehen, einschlafen, wachsen)
      sowie sein, bleiben und passieren. Regelmäßig: ge-...-t, unregelmäßig: ge-...-en.
    examples:
      - "Wir haben gestern Abend einen guten Film gesehen."
      - "Meine Eltern sind im Sommer nach Italien gefahren."
      - "Was ist auf dem Weg zur Schule passiert?"
  - type: grammar
    lemma: "Personalpronomen im Akkusativ und Dativ"
    level: A2
    source: seed
    tags: [grammatik, kasus]
    definition: >-
      Akkusativ: mich, dich, ihn, sie, es, uns, euch, sie/Sie. Dativ: mir, dir, ihm, ihr, ihm,
      uns, euch, ihnen/Ihnen. Das Pronomen richtet sich nach dem Genus des Nomens, nicht nach dem
      Geschlecht der Sache. Stehen zwei Pronomen zusammen, kommt der Akkusativ zuerst: Ich gebe es
      dir.
    examples:
      - "Der Schlüssel ist weg; ich finde ihn nicht."
      - "Kannst du mir bitte kurz helfen?"
      - "Das Buch ist toll; ich leihe es dir gern."
  - type: grammar
    lemma: "Possessivartikel"
    level: A2
    source: seed
    tags: [grammatik, kasus]
    definition: >-
      mein, dein, sein, ihr, unser, euer, ihr/Ihr zeigen, wem etwas gehört. Sie bekommen dieselben
      Endungen wie ein und kein: mein Bruder, meine Schwester, mein Kind, meine Eltern. Im
      Akkusativ maskulin steht -en (meinen Bruder), im Dativ -em/-er/-en. Bei euer fällt vor der
      Endung ein e weg: eure Wohnung.
    examples:
      - "Meine Schwester wohnt jetzt in einer anderen Stadt."
      - "Hast du deinen Ausweis dabei?"
      - "Wir fahren mit unserem Auto in den Urlaub."
  - type: grammar
    lemma: "Präpositionen mit Akkusativ"
    level: A2
    source: seed
    tags: [grammatik, kasus]
    definition: >-
      durch, für, gegen, ohne, um stehen immer mit dem Akkusativ, egal ob Bewegung oder nicht.
      Nach ohne steht das Nomen meistens ohne Artikel. um ... herum beschreibt eine Runde, gegen
      kann Widerstand oder eine ungefähre Zeit bedeuten: gegen acht Uhr.
    examples:
      - "Dieses Geschenk ist für meinen besten Freund."
      - "Ohne Ausweis kommen Sie nicht in das Gebäude."
      - "Wir gehen jeden Abend durch den Park."
  - type: grammar
    lemma: "Präpositionen mit Dativ"
    level: A2
    source: seed
    tags: [grammatik, kasus]
    definition: >-
      aus, bei, mit, nach, seit, von, zu, gegenüber stehen immer mit dem Dativ. Häufige
      Verschmelzungen: zu dem = zum, zu der = zur, bei dem = beim, von dem = vom. nach benutzt man
      bei Städten und Ländern ohne Artikel, zu bei Personen und Einrichtungen, in bei Ländern mit
      Artikel.
    examples:
      - "Nach der Arbeit fahre ich zum Sportverein."
      - "Seit einem Jahr wohnen wir bei meiner Tante."
      - "Der Zug kommt gerade aus der Schweiz."
  - type: grammar
    lemma: "Präteritum von sein, haben und den Modalverben"
    level: A2
    source: seed
    tags: [grammatik, zeiten]
    definition: >-
      Auch beim Sprechen benutzt man bei sein, haben und den Modalverben das Präteritum statt des
      Perfekts: war, hatte, konnte, musste, wollte, durfte, sollte, mochte. Die Modalverben
      verlieren im Präteritum den Umlaut. Die 1. und 3. Person Singular sind gleich und haben
      keine Endung: ich war, er war.
    examples:
      - "Als Kind war ich oft bei meiner Großmutter."
      - "Wir hatten letzte Woche leider keine Zeit."
      - "Gestern musste sie länger im Büro bleiben."
  - type: grammar
    lemma: "Reflexive Verben"
    level: A2
    source: seed
    tags: [grammatik, verben]
    definition: >-
      Bei reflexiven Verben zeigt das Pronomen zurück auf das Subjekt: sich freuen, sich
      interessieren, sich beeilen. Normal steht es im Akkusativ (mich, dich, sich, uns, euch,
      sich). Kommt ein zweites Objekt dazu, steht das Reflexivpronomen im Dativ: Ich wasche mir
      die Hände. Das Pronomen steht meist direkt nach dem konjugierten Verb.
    examples:
      - "Meine Tochter freut sich schon auf die Ferien."
      - "Beeilt euch, der Bus fährt gleich ab!"
      - "Vor dem Essen wasche ich mir die Hände."
  - type: grammar
    lemma: "Satzklammer und Verb an Position 2"
    level: A2
    source: seed
    tags: [grammatik, satzbau]
    definition: >-
      Im Aussagesatz steht das konjugierte Verb immer an zweiter Stelle. Position 1 ist nur ein
      Element: das Subjekt, eine Zeitangabe, ein Ort. Wenn dort nicht das Subjekt steht, rutscht
      das Subjekt direkt hinter das Verb. Ein zweiter Verbteil (Partizip, Infinitiv, Präfix) geht
      ans Satzende. Verb 2 und Verb 2-Teil bilden zusammen die Satzklammer.
    examples:
      - "Am Montag fahre ich mit dem Bus zur Arbeit."
      - "Meine Schwester hat gestern einen Kuchen gebacken."
      - "Nach dem Essen räumt mein Bruder die Küche auf."
  - type: grammar
    lemma: "Trennbare Verben"
    level: A2
    source: seed
    tags: [grammatik, verben]
    definition: >-
      Bei trennbaren Verben trägt das Präfix den Wortakzent: AUFstehen, EINkaufen, ANrufen. Im
      Hauptsatz steht das Präfix am Satzende. Im Partizip II steht ge- zwischen Präfix und Stamm
      (aufgestanden). Vor einem Infinitiv mit zu steht das zu ebenfalls in der Mitte: aufzustehen.
      Im Nebensatz bleibt das Verb zusammen.
    examples:
      - "Morgens stehe ich meistens um sechs Uhr auf."
      - "Meine Freundin hat mich gestern Abend angerufen."
      - "Es ist schwer, im Winter früh aufzustehen."
  - type: grammar
    lemma: "Verben mit Dativ"
    level: A2
    source: seed
    tags: [grammatik, kasus]
    definition: >-
      helfen, danken, gehören, gefallen, passen, stehen (kleiden), schmecken, antworten,
      gratulieren, folgen und wehtun nehmen ein Dativobjekt, obwohl im Deutschen ein Akkusativ
      logisch wirkt. Bei gefallen und schmecken ist die Sache das Subjekt und die Person steht im
      Dativ: Mir gefällt das Bild.
    examples:
      - "Das Bild gefällt meiner Mutter sehr gut."
      - "Dieser Mantel gehört meinem Bruder."
      - "Wir danken Ihnen für die schnelle Antwort."
  - type: grammar
    lemma: "Vergleiche mit wie und als"
    level: A2
    source: seed
    tags: [grammatik, adjektive]
    definition: >-
      Bei Gleichheit steht (genau)so + Adjektiv + wie, bei Ungleichheit der Komparativ + als. Mit
      nicht so ... wie drückt man aus, dass etwas weniger ist. Häufiger Fehler: als nach so und
      wie nach dem Komparativ.
    examples:
      - "Diese Wohnung ist genauso teuer wie die andere."
      - "Heute ist es wärmer als gestern."
      - "Der Film war nicht so gut wie das Buch."
  - type: grammar
    lemma: "Wechselpräpositionen"
    level: A2
    source: seed
    tags: [grammatik, kasus]
    definition: >-
      in, an, auf, über, unter, vor, hinter, neben, zwischen stehen mit zwei Fällen. Die Frage
      Wohin? (Bewegung zu einem Ziel) verlangt den Akkusativ, die Frage Wo? (Ort, keine Richtung)
      den Dativ. Typische Paare sind stellen/stehen, legen/liegen, setzen/sitzen, hängen/hängen.
    examples:
      - "Stell die Flaschen bitte in den Kühlschrank."
      - "Die Milch steht schon im Kühlschrank."
      - "Zwischen den beiden Häusern steht ein alter Baum."
  - type: grammar
    lemma: "Zeitangaben mit am, im, um"
    level: A2
    source: seed
    tags: [grammatik, zeit]
    definition: >-
      am steht bei Tagen und Tageszeiten (am Montag, am Abend, aber: in der Nacht), im bei Monaten
      und Jahreszeiten (im Mai, im Winter), um bei der Uhrzeit (um acht Uhr). Ohne Präposition
      stehen Jahreszahlen (2026 oder im Jahr 2026), heute, morgen, nächste Woche.
    examples:
      - "Am Freitag beginnt der Kurs um neun Uhr."
      - "Im August fahren viele Familien in Urlaub."
      - "Nächste Woche habe ich einen Termin beim Arzt."
  - type: grammar
    lemma: "Zukunft mit Präsens"
    level: A2
    source: seed
    tags: [grammatik, zeiten]
    definition: >-
      Für die Zukunft benutzt man im Alltag meistens das Präsens zusammen mit einer Zeitangabe:
      morgen, nächste Woche, in zwei Jahren. Das Futur mit werden + Infinitiv braucht man vor
      allem für Vorhersagen, Versprechen und Vermutungen, oft mit wohl oder sicher.
    examples:
      - "Nächsten Monat ziehen wir in eine neue Wohnung."
      - "Morgen früh rufe ich dich an."
      - "Es wird morgen wahrscheinlich regnen."

